<!doctype html><html><head><meta charset="utf-8"><title>Pitwall</title>
<style>
:root{--a:#00D2BE;--bg:#232323;--c:#2f2f2f;--l:#3d3d3d;--t:#ececec;--m:#8c8c8c;--chip:#4a4a4a;--chipH:#595959;--go:#454545;--goH:#555;--goT:#ccc;--edge:#4a4a4a;--road:#1c1c1c;--ov:#000b;color-scheme:light dark;--f:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:13px var(--f);padding:26px 20px 60px;user-select:none;max-width:1020px;margin:0 auto}
h1{font:700 17px var(--f);letter-spacing:.14em}h1 b{color:var(--a)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sub{color:var(--m);font-size:11px;font-weight:600;letter-spacing:.06em;margin-top:3px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--l);border-radius:8px;padding:4px 12px 4px 8px;color:var(--t);font-size:12px;font-weight:600}
.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:780px){.dash{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:4px 14px}
.tc{padding:16px}
.stats{display:flex;justify-content:space-around;border-top:1px solid var(--l);margin-top:12px;padding-top:12px;text-align:center}
.stats span{display:block;color:var(--m);font-size:10px;letter-spacing:.16em;font-weight:600;margin-bottom:2px}.stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;height:48px;border-bottom:1px solid var(--l);margin:0 -14px;padding:0 14px}.row:last-child{border:0}
.live{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 16%,transparent),transparent)}
.who{flex:1;display:flex;align-items:center;gap:10px;height:100%;cursor:pointer;font-weight:600;min-width:0}
.row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}.live .dot{animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.tag{font-size:11px;font-weight:600;color:var(--m);width:24px}
button,input{font:inherit;color:var(--t)}
button{background:none;border:1px solid transparent;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:11px;font-weight:600;color:var(--m);transition:.15s}
button:hover{color:var(--t);border-color:var(--l)}
.t{font-size:15px;font-weight:600;color:var(--t);width:76px;text-align:right;font-variant-numeric:tabular-nums;border-radius:0;padding:2px 0;border-bottom:1px dotted var(--l)}.t:hover{color:var(--a);border-color:var(--a)}
.ed{width:76px!important;text-align:right;padding:3px 5px!important;font-size:14px!important;font-weight:600;border:1px solid var(--a)!important;border-radius:4px!important}
.chip{border-color:var(--l)}
.go{background:var(--a);color:#000;width:30px;height:30px;padding:0;border-radius:50%;font-size:10px;border:0}.go:hover{background:var(--a);color:#000;filter:brightness(1.15)}
.x{opacity:0;padding:4px}.row:hover .x{opacity:1}
input{background:var(--c);border:1px solid var(--l);border-radius:6px;padding:9px 10px;width:100%;outline:none}input:focus{border-color:var(--a)}
.row input{border:0;background:none;padding:0}
.mono{font-variant-numeric:tabular-nums}.hh{font-family:var(--f)}
.lbl{color:var(--m);font-size:10px;font-weight:600;letter-spacing:.2em;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.col>.lbl:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.d{background:var(--c);border:1px solid var(--l);border-radius:6px;padding:6px 2px 5px;text-align:center;font-size:10px;font-weight:600;cursor:pointer}
.d:hover{border-color:var(--m)}.d.on{border-color:var(--a)}.d span{color:var(--m);display:block;font-size:9px;font-weight:500}
.bar{height:4px;background:var(--l);border-radius:2px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.two{display:flex;gap:8px;align-items:center;margin:6px 0}input[type=color]{width:34px;height:30px;padding:0;flex:none}
.show{display:flex;align-items:center;justify-content:space-between;background:var(--c);border:1px solid var(--l);border-radius:10px;padding:14px;margin-top:14px}
.ov{position:fixed;inset:0;background:var(--ov);z-index:4}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--l);padding:24px 20px 40px;overflow:auto;z-index:5}
details.np{margin-top:10px}details.np summary{cursor:pointer;color:var(--m);font-size:12px;font-weight:600;padding:6px 0}
.chip{background:var(--chip);color:var(--t);border-color:transparent}.chip:hover{background:var(--chipH);border-color:transparent}
.go{background:var(--go);color:var(--goT)}.go:hover{background:var(--goH);color:var(--t);filter:none}
.live .go{background:var(--a);color:#000}.live .go:hover{background:var(--a);color:#000;filter:brightness(1.15)}
@media(prefers-color-scheme:light){:root{--bg:#f2f2f4;--c:#fff;--l:#dcdce0;--t:#1d1d1f;--m:#6e6e73;--chip:#e6e6ea;--chipH:#d8d8dd;--go:#e6e6ea;--goH:#d4d4d9;--goT:#48484a;--edge:#cfcfd4;--road:#e9e9ee;--ov:#0006}}
.flag{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;font-size:12px;font-weight:600;color:#f2c14e}.flag i{width:9px;height:9px;background:#f2c14e;border-radius:2px}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--m);flex:none;transition:.15s}.chk.on{background:var(--a);border-color:var(--a)}
.wk{display:flex;gap:3px}.wk i{width:6px;height:14px;border-radius:2px;background:var(--l)}.wk i.on{background:var(--a)}
.hist{display:flex;gap:6px;align-items:flex-end;height:100px}.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.hist i{display:block;width:100%;background:var(--l);border-radius:3px 3px 0 0;min-height:2px}.hist i.pb{background:var(--a)}.hist span{font-size:9px;color:var(--m)}
select{background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:6px;padding:8px;flex:1;font:inherit;min-width:0}
body{max-width:560px;padding-bottom:110px}
.view>*+*{margin-top:14px}.view>.lbl:first-child{margin-top:0}
.view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.view.enter>*:nth-child(2){animation-delay:.06s}.view.enter>*:nth-child(3){animation-delay:.12s}.view.enter>*:nth-child(4){animation-delay:.18s}.view.enter>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:color-mix(in srgb,var(--c) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--l);border-radius:16px;box-shadow:0 8px 30px #0005;z-index:9}
.nav button{position:relative;z-index:1;padding:9px 11px;font-size:12px;border-radius:12px;border:0;color:var(--m);transition:color .25s,transform .15s}.nav button.on{color:var(--t)}.nav button:hover{border:0}
#ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:12px;background:var(--l);transition:transform .4s cubic-bezier(.3,.9,.25,1),width .4s cubic-bezier(.3,.9,.25,1)}
button:active{transform:scale(.95)}.row,.card,.tile{transition:background .3s,border-color .25s}.bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
#mkc.pulse{animation:pl 1s ease-in-out infinite}@keyframes pl{50%{opacity:.5}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px 14px}.tile.wide{padding:14px}
.tile span{display:block;color:var(--m);font-size:10px;font-weight:600;letter-spacing:.16em;margin-bottom:6px}.tile b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.tile small{display:block;color:var(--m);font-size:11px;margin-top:3px;font-weight:500}.tile.wide b small{display:inline;font-size:14px}
.stack{display:flex;height:10px;gap:2px;border-radius:5px;overflow:hidden;margin-bottom:12px}.stack i{display:block}
.lg{display:flex;align-items:center;gap:10px;height:32px}
.me{padding:2px 8px}
.hd{display:flex;gap:12px;align-items:center}.num{background:var(--a);color:#000;font-weight:700;font-size:16px;min-width:40px;height:40px;border-radius:9px;display:grid;place-items:center;letter-spacing:-.02em}
.nav button{padding:9px 12px}.wk i{width:8px;height:16px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pick{border:1px solid var(--l);padding:7px 12px;border-radius:999px;display:inline-flex;gap:7px;align-items:center;color:var(--t);font-size:12px}.pick.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}.pick:disabled{opacity:.4;cursor:default}
.cta{background:var(--a);color:#000;border:0;border-radius:12px;padding:14px 0;width:100%;font-size:14px;font-weight:600;transition:filter .2s,transform .15s}.cta:hover{filter:brightness(1.12);color:#000;border:0}
#toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--c);border:1px solid var(--l);border-radius:12px;padding:10px 14px;font-size:12px;box-shadow:0 8px 30px #0005;transition:.3s;z-index:10;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{color:var(--a);font-weight:600;margin-left:10px;padding:2px 6px}
@media(hover:none){.x{opacity:.45}}

 sk=id=>{let n=0,d=new Date();const f=x=>(S.hlog[x.toLocaleDateString('sv')]||[]).includes(id);if(!f(d))d.setDate(d.getDate()-1);while(f(d)){n++;d.setDate(d.getDate()-1)}return n},bs=Math.max(0,...S.habits.map(h=>sk(h.id))),
 nx=S.exams.find(e=>new Date(e.date+'T23:59')>=new Date()),dy=nx?Math.max(1,Math.ceil((new Date(nx.date+'T09:00')-Date.now())/864e5)):0,rem=nx?Math.max(0,nx.hours*3600-allT(nx.sector)):0,
 gr=S.groups[0],rk=gr?(()=>{const rows=[...(G[gr.code]||[]).filter(r=>r.member!=S.id&&r.week==wk()),{member:S.id,secs:tot}].sort((a,b)=>b.secs-a.secs);return['P'+(rows.findIndex(r=>r.member==S.id)+1),'of '+rows.length+' · '+gr.name]})():['—','no paddock yet'];
 const tile=(l,b,sm)=>`<div class="tile"><span>${l}</span><b>${b}</b><small>${sm}</small></div>`;
 return `<div class="tile wide"><span>THIS WEEK</span><b>${(tot/3600).toFixed(1)}h <small>/ ${S.goal}h</small></b><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,tot/g*100)}%"></i></div></div>
 <div class="tiles">${tile('TODAY',fmt(td),'of '+fmt(dt))}${tile('PIT STOPS',done+'/'+S.habits.length,'best streak '+bs+'d')}${tile('NEXT EXAM',nx?dy+'d':'—',nx?nx.name+' · '+(rem?fmt(rem/dy)+'/day':'target hit'):'none set')}${tile('PADDOCK',rk[0],rk[1])}${tile('SPRINTS',S.laps[wk()]||0,'longest stint '+fmt(S.best||0))}${tile('TO GO',fmt(Math.max(0,g-tot)),'of '+S.goal+'h week')}</div>
 <div><div class="lbl">THIS WEEK BY SECTOR</div><div class="card tc"><div class="stack">${S.sectors.map(x=>`<i style="flex:${sec(x.id)||.001};background:${x.color}"></i>`).join('')}</div>${S.sectors.map(x=>`<div class="lg"><span class="dot" style="background:${x.color}"></span><span class="n">${x.name}</span><span class="sub">${fmt(sec(x.id))}${tot?' · '+Math.round(sec(x.id)/tot*100)+'%':''}</span></div>`).join('')}</div></div>${history()}`}
function history(){const ws=Object.keys(S.logs).sort().slice(-8),tt=w=>Object.values(S.logs[w]).reduce((a,b)=>a+b,0)+(w==wk()&&S.run?el(S.run.s):0),best=Math.max(0,...ws.map(tt)),mx=Math.max(S.goal*3600,best,1),al=S.sectors.map(x=>[x.name,allT(x.id)]).sort((a,b)=>a[1]-b[1])[0];
 return `<div class="lbl">HISTORY</div><div class="card tc"><div class="hist">${ws.map(w=>`<div title="${w}"><i class="${best&&tt(w)==best?'pb':''}" style="height:${tt(w)/mx*85}%"></i><span>${w.slice(5)}</span></div>`).join('')}</div><div class="sub" style="margin-top:10px">Best week ${fmt(best)} · longest stint ${fmt(S.best||0)}${al?' · least time: '+al[0]:''}</div></div>`}
function habits(){const t=today(),ds=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toLocaleDateString('sv')}),did=(h,d)=>(S.hlog[d]||[]).includes(h),
 streak=h=>{let n=0,d=new Date();if(!did(h,t))d.setDate(d.getDate()-1);while(did(h,d.toLocaleDateString('sv'))){n++;d.setDate(d.getDate()-1)}return n};
 return `<div class="lbl">PIT STOPS</div><div class="card">${S.habits.map(h=>`<div class="row"><span class="who" onclick="tog('${h.id}')"><span class="chk ${did(h.id,t)?'on':''}"></span>${h.name}</span><span class="wk">${ds.map(d=>`<i class="${did(h.id,d)?'on':''}" title="${d}" onclick="tog('${h.id}','${d}')"></i>`).join('')}</span><span class="sub" style="width:30px;text-align:right">${streak(h.id)}d</span><button class="x" onclick="delH('${h.id}')">×</button></div>`).join('')}<div class="row"><input id="nh" placeholder="+ habit" onkeydown="if(event.key=='Enter')addH()"></div></div>`}
function tog(id,k){k=k||today();const a=S.hlog[k]=S.hlog[k]||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();draw()}
function addH(){const v=nh.value.trim();if(v){S.habits.push({id:'h'+Date.now(),name:v});save();draw()}}
function delH(id){if(confirm('Remove this habit?')){S.habits=S.habits.filter(h=>h.id!=id);save();draw()}}
function exams(){return `<div class="lbl">EXAMS</div><div class="card">${S.exams.map(e=>{const dy=Math.ceil((new Date(e.date+'T09:00')-Date.now())/864e5),rem=Math.max(0,e.hours*3600-allT(e.sector)),sc=S.sectors.find(x=>x.id==e.sector);
 return `<div class="row"><span class="dot" style="background:${sc?sc.color:'var(--m)'}"></span><span class="n">${e.name}</span><span class="sub">${dy<0?'past':dy==0?'today':dy+'d'} · ${rem?fmt(dy>0?rem/dy:rem)+'/day':'target hit'}</span><button class="x" onclick="delE('${e.id}')">×</button></div>`}).join('')||'<div class="row"><span class="sub">No exams yet</span></div>'}
 <details class="np"><summary>+ Add exam</summary><div class="two"><input id="en" placeholder="Name"><input id="edt" type="date" style="width:150px"></div><div class="two"><select id="es">${S.sectors.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="eh" type="number" placeholder="Target hours" style="width:130px"><button class="chip" onclick="addE()">Add</button></div></details></div>`}
function addE(){if(en.value.trim()&&edt.value&&+eh.value>0){S.exams.push({id:'e'+Date.now(),name:en.value.trim(),date:edt.value,sector:es.value,hours:+eh.value});S.exams.sort((a,b)=>a.date<b.date?-1:1);save();draw()}}
function delE(id){S.exams=S.exams.filter(e=>e.id!=id);save();draw()}
function stand(code){const pts=[25,18,15,12,10,8,6,4,2,1],T={},nm={},all=[...(G[code]||[]).filter(r=>!(r.member==S.id&&r.week==wk())),{member:S.id,name:S.name||'You',week:wk(),secs:total()}];
 [...new Set(all.map(r=>r.week))].forEach(w=>all.filter(r=>r.week==w).sort((a,b)=>b.secs-a.secs).forEach((r,i)=>{if(r.secs>0){T[r.member]=(T[r.member]||0)+(pts[i]||0);nm[r.member]=r.name}}));
 const o=Object.entries(T).sort((a,b)=>b[1]-a[1]);
 return `<details class="np"><summary>Season standings</summary><div class="card">${o.map(([m,p],i)=>`<div class="row"><span class="tag">P${i+1}</span><span class="n">${nm[m]||'?'}</span><span class="sub" style="width:60px;text-align:right">${p} pts</span></div>`).join('')||'<div class="row"><span class="sub">No points yet</span></div>'}</div></details>`}
function sectors(){const r=S.run;
 return `<div class="card">${S.sectors.map(s=>{const on=r&&r.s==s.id;return `<div class="row ${on?'live':''}"><button class="go" onclick="go('${s.id}')">${on?'■':'▶'}</button><span class="who" onclick="go('${s.id}')"><span class="dot" style="background:${s.color}"></span>${s.name}</span>${E==s.id?`<input id="ed" class="ed" value="${Math.floor(sec(s.id)/3600)}:${String(Math.floor(sec(s.id)%3600/60)).padStart(2,'0')}" onblur="commit(this.value)" onkeydown="if(event.key=='Enter')this.blur();if(event.key=='Escape'){E=null;draw()}">`:`<button class="t" id="t-${s.id}" title="Click to edit (e.g. 2:30, 90m, 1h30)" onclick="edit('${s.id}')">${on?clock(sec(s.id)):fmt(sec(s.id))}</button>`}
 <button class="chip" onclick="bump('${s.id}',1800,'+30m')">+30m</button><button class="chip" onclick="bump('${s.id}',3600,'+1h')">+1h</button>
 <button class="x" onclick="del('${s.id}')">×</button></div>`}).join('')}
 <div class="row"><input id="ns" placeholder="+ sector" onkeydown="if(event.key=='Enter')addS()"></div></div>`}
function bump(id,x,l){add(id,x);const n=(S.sectors.find(y=>y.id==id)||{}).name;toast(l+' added to '+n,()=>add(id,-x))}
let tt=0;function toast(m,f){const t=$('toast');t.innerHTML=m+'<button id="und">Undo</button>';t.classList.add('on');$('und').onclick=()=>{f();t.classList.remove('on')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),6000)}
function addS(){const v=document.getElementById('ns').value.trim();if(v){S.sectors.push({id:'s'+Date.now(),name:v,color:PAL[S.sectors.length%PAL.length]});save();draw()}}
function del(id){if(confirm('Remove this sector?')){S.sectors=S.sectors.filter(s=>s.id!=id);save();draw()}}
function paddock(){const mine={member:S.id,name:S.name||'You',driver:S.driver,shell:shell(),stripe:S.stripe,secs:total()};
 return (SE&&S.groups.length?`<div class="sub" style="color:#f2c14e;line-height:1.5">Sync problem: ${SE}</div>`:'')+S.groups.map(g=>{const rows=[...(G[g.code]||[]).filter(r=>r.member!=S.id&&r.week==wk()),mine].sort((a,b)=>b.secs-a.secs),mx=Math.max(S.goal*3600,rows[0].secs,1);
 return `<div class="lbl">${g.name.toUpperCase()} · CODE ${g.code} <button class="x" onclick="leave('${g.code}')">leave</button></div><div class="card">${rows.map((r,i)=>`<div class="row"><span class="tag">P${i+1}</span>${helmet(r.driver,r.shell||drv(r.driver)[3],r.stripe,30)}<span class="n">${r.name}</span><div class="bar"><i style="width:${Math.min(100,r.secs/mx*100)}%"></i></div><span class="sub mono" style="width:54px;text-align:right">${fmt(r.secs)}</span></div>`).join('')}</div>${stand(g.code)}`}).join('')+
 `<details class="np"><summary>+ New / join paddock</summary><div class="two"><input id="gn" placeholder="Name (e.g. Study Squad)"><input id="gc" placeholder="Code (blank = new)" style="width:150px"></div><button onclick="join()" style="width:100%;border-color:var(--l)">Create / join</button></details>`+
 (S.sync.url?'':'<p class="sub" style="margin-top:12px">Friends show up once sync is set up in Garage (see README).</p>')}
function join(){const n=gn.value.trim()||'Paddock',c=(gc.value.trim()||Math.random().toString(36).slice(2,7)).toUpperCase();S.groups.push({name:n,code:c});save();pull();draw()}
function leave(c){S.groups=S.groups.filter(g=>g.code!=c);save();draw()}
function garage(){const d=drv(S.driver);
 return `<div class="show">${CARIMG[d[2]]?`<img src="${CARIMG[d[2]]}" width="190" style="display:block">`:car(shell(),d[0])}${helmet(d[0],shell(),S.stripe,62)}</div>
 <div class="lbl">NAME</div><input value="${S.name}" placeholder="Your name" oninput="S.name=this.value;save()">
 <div class="lbl">SUIT / SHOES &amp; NUMBER</div><div class="two"><input type="color" value="${shell()}" onchange="S.shell=this.value;save();draw()"><input type="color" value="${S.stripe}" onchange="S.stripe=this.value;save();draw()"><button onclick="S.shell=null;S.stripe='#2b2e34';save();draw()">reset</button></div>
 <div class="lbl">THE GRID</div><div class="grid">${D.map(x=>`<div class="d ${x[0]==S.driver?'on':''}" onclick="S.driver=${x[0]};S.shell=null;save();draw()">${helmet(x[0],x[3],'#2b2e34',38)}${x[1].split(' ')[1]}<span>${x[2]}</span></div>`).join('')}</div>
 <div class="lbl">WEEKLY RACE DISTANCE (HOURS)</div><input type="number" min="1" value="${S.goal}" onchange="S.goal=+this.value||20;save();draw()">`}
const H=()=>{const h={apikey:S.sync.key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'};if(!S.sync.key.startsWith('sb_'))h.Authorization='Bearer '+S.sync.key;return h};
async function push(){if(!S.sync.url)return;for(const g of S.groups)try{const r=await fetch(S.sync.url+'/rest/v1/laps?on_conflict=code,member,week',{method:'POST',headers:H(),body:JSON.stringify({code:g.code,member:S.id,week:wk(),name:S.name,driver:S.driver,shell:shell(),stripe:S.stripe,secs:total()})});if(!r.ok){const j=await r.json().catch(()=>({}));SE=j.message||('HTTP '+r.status)}}catch(e){SE='offline'}}
async function pull(){if(!S.sync.url)return;for(const g of S.groups)try{const j=await(await fetch(`${S.sync.url}/rest/v1/laps?code=eq.${g.code}`,{headers:H()})).json();if(Array.isArray(j)){G[g.code]=j;SE=''}else SE=j.message||j.hint||'unknown error'}catch(e){SE='offline'}if(!P&&!E&&!document.querySelector('details[open]')&&document.activeElement.tagName!='INPUT')draw()}
function setTab(t){if(t==tab)return;tab=t;enter=true;if(t=='race')DS={};draw()}
function moveInd(){const b=document.querySelector('#nv .on'),i=$('ind');if(i){if(!b){i.style.width='0px';return}i.style.width=b.offsetWidth+'px';i.style.transform='translateX('+b.offsetLeft+'px)'}}
function draw(){const d=drv(S.driver);document.documentElement.style.setProperty('--a',d[3]);
 const v={race:()=>raceTop()+sectors(),sprint,plan:()=>habits()+exams(),overview,paddock,garage}[tab]();
 app.innerHTML=`<div class="top"><div class="hd"><div class="num">${d[0]}</div><div><h1>PIT<b>WALL</b></h1><div class="sub">Week ${wnum()} · ${d[1]} · ${d[2]}</div></div></div><button class="me" onclick="setTab('garage')">${helmet(d[0],shell(),S.stripe,34)}</button></div><div class="view ${enter?'enter':''}">${v}</div>`;enter=false;
 const ph=$('tkph');if(ph)ph.replaceWith(buildTrack());
 document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));moveInd();upd()}
window.addEventListener('resize',moveInd);
setInterval(tick,1000);setInterval(()=>{push();pull()},60000);
if(S.run){const e=el(S.run.s);if(e>10800){const m=prompt('Timer was left running for '+fmt(e)+'. Minutes to keep? (0 = discard)',Math.min(60,Math.round(e/60)));const k=parseFloat(m);if(m!==null&&k>=0){log()[S.run.s]=(log()[S.run.s]||0)+k*60;dayAdd(k*60);S.run=null;save()}}}
draw();pull();
</script></body></html>
